let lastOut=null;
async function decodeInputData(hex,abi){
hex=hx(hex);
if(hex.length<8)return {error:'hex'};
const sel='0x'+hex.slice(0,8);
let sig=null,src='';
const found=await lookupSig(sel,'function');
if(found){sig=found.sig;src=found.src;}
let entry=null;
if(abi&&sig){const ps=parseSig(sig);if(ps)entry=abiEntry(abi,ps.name,'function');}
let types=[],names=[];
if(entry){const s=entrySig(entry);const ps=parseSig(s);if(ps)types=ps.types;names=namesOf(entry,types);}
else if(sig){const ps=parseSig(sig);if(ps){types=ps.types;names=types.map((_,i)=>'arg'+i);}}
let vals=[],rawWords=words(hex.slice(8));
try{if(types.length)vals=decodeParams(types,hex.slice(8),0).vals;}catch(e){}
return {selector:sel,sig:sig||'(unknown)',src,names,types,vals,rawWords};
}
async function decodeLog(topics,dataHex,abi){
topics=(topics||[]).map(x=>'0x'+hx(x));dataHex=hx(dataHex);
const t0=(topics[0]||'').toLowerCase();
let sig=null,src='';
if(t0&&t0!=='0x'){const f=await lookupSig(t0,'event');if(f){sig=f.sig;src=f.src;}}
let types=[],names=[],indexed=[];
if(sig){const ps=parseSig(sig);if(ps){let entry=null;if(abi)entry=abiEntry(abi,ps.name,'event');
if(entry&&entry.inputs){entry.inputs.forEach(inp=>{const full=inp.type+(inp.components?'('+inp.components.map(c=>c.type).join(',')+')':'');types.push(full);names.push(inp.name||'');indexed.push(!!inp.indexed);});}
else{types=ps.types;names=types.map((_,i)=>'arg'+i);indexed=types.map(()=>false);}}}
const idxVals=[],dataVals=[];
try{
types.forEach((ty,i)=>{
if(indexed[i]){const w=hx(topics[i+1]||'');idxVals.push(isDyn(ty)?('0x'+w):decStatic(ty,w));}
});
const dynTypes=types.filter((_,i)=>!indexed[i]);
if(dynTypes.length)dataVals.push(...decodeParams(dynTypes,dataHex,0).vals);
}catch(e){}
const rawWords=topics.slice(1).concat(words(dataHex));
return {topic0:t0,sig:sig||'(unknown)',src,names,types,indexed,idxVals,dataVals,rawWords};
}
function renderDecoded(o,isLog){
let h='';
if(o.error)return `<div class="note">${t('needHex')}</div>`;
h+=`<div><span style="color:var(--mut)">${isLog?t('eventL'):t('funcL')}:</span> <span class="sig">${esc(o.sig)}</span> <small style="color:var(--mut)">${esc(o.src||t('dbFail'))}</small></div>`;
if(o.selector)h+=`<div style="font-size:12px" class="mono">selector: ${esc(o.selector)}</div>`;
if(o.topic0)h+=`<div style="font-size:12px" class="mono">topic0: ${esc(o.topic0)}</div>`;
if(o.names&&o.names.length){
const allN=o.names,allT=o.types;
let vals;
if(isLog){vals=[];let di=0,ii=0;allT.forEach((ty,i)=>{if(o.indexed&&o.indexed[i])vals.push(o.idxVals[ii++]);else vals.push(o.dataVals[di++]);});}
else vals=o.vals;
h+=paramTable(allN,allT,vals);
}else{h+=`<div class="note">${t('dbFail')}</div><pre class="out">${o.rawWords.map(w=>'0x'+w).join('\n')}</pre>`;}
h+=`<pre class="out">${esc(prettyJSON(o))}</pre><div class="row"><button class="alt" onclick="copyTxt(JSON.stringify({sig:o.sig,vals:o.vals||o.dataVals}))">${t('btnCopy')}</button><button class="alt" onclick="dlReport()">${t('dlJson')}</button></div>`;
return h;
}
async function rpcCall(rpc,method,params){
const r=await fetch(rpc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
if(!r.ok)throw 0;const j=await r.json();if(j.error)throw 0;return j.result;
}
async function fetchTx(){
const h=document.getElementById('txIn').value.trim();
if(!/^0x[0-9a-fA-F]{64}$/.test(h)){toast(t('needTx'));return;}
const ch=CHAINS[document.getElementById('chainSel').selectedIndex]||CHAINS[0];
const abi=document.getElementById('abiIn').value.trim();
const box=document.getElementById('txRes');box.innerHTML='<p class="sub">'+t('fetching')+'</p>';
try{
const tx=await rpcCall(ch.rpc,'eth_getTransactionByHash',[h]);
if(!tx)throw 0;
const rc=await rpcCall(ch.rpc,'eth_getTransactionReceipt',[h]).catch(()=>null);
let html=`<div class="note">${ch.n} · ${t('block')}: ${tx.blockNumber?parseInt(tx.blockNumber,16):'pending'}</div>`;
html+=`<div style="font-size:13px"><b>${t('from')}:</b> <span class="mono">${esc(tx.from||'')}</span><br><b>${t('to')}:</b> <span class="mono">${esc(tx.to||'')}</span><br><b>${t('value')}:</b> <span class="mono">${weiStr(tx.value)}</span></div>`;
const dec=await decodeInputData(tx.input||'0x',abi);
dec.tx=h;lastOut=dec;
html+=`<h3 style="margin-top:10px">${t('funcL')}</h3>`+renderDecoded(dec,false);
const logs=(rc&&rc.logs)||[];
for(let i=0;i<logs.length;i++){const L=logs[i];
const d=await decodeLog(L.topics||[],L.data||'0x',abi);
d.index=L.logIndex;lastOut=d;
html+=`<div class="logcard"><b>Log #${i}</b> · <span class="mono">${esc(L.address||'')}</span>`+renderDecoded(d,true)+`</div>`;}
box.innerHTML=html;
}catch(e){box.innerHTML='<div class="note">'+t('fetchFail')+'</div>';}
}
function weiStr(w){try{const b=BigInt(w||'0x0');const e=1000000000000000000n;return (b/e).toString()+'.'+(b%e).toString().padStart(18,'0').replace(/0+$/,'')+' ETH';}catch(e){return String(w);}}
async function decManualInput(){
const hex=document.getElementById('rawIn').value;
if(hx(hex).length<8){toast(t('needHex'));return;}
const abi=document.getElementById('rawAbi').value.trim();
const dec=await decodeInputData(hex,abi);lastOut=dec;
document.getElementById('manInRes').innerHTML=renderDecoded(dec,false);
}
async function decManualLog(){
const topics=document.getElementById('rawTopics').value.split('\n').map(s=>s.trim()).filter(Boolean);
const data=document.getElementById('rawData').value;
if(!topics.length){toast(t('needHex'));return;}
const abi=document.getElementById('rawAbi').value.trim();
const dec=await decodeLog(topics,data,abi);lastOut=dec;
document.getElementById('manLogRes').innerHTML=renderDecoded(dec,true);
}
function dlReport(){
if(!lastOut)return;const b=new Blob([prettyJSON(lastOut)],{type:'application/json'});const a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='abilens-decode.json';a.click();
}
function renderDonate(){
const P=CONFIG.pay;
document.getElementById('btcA').textContent=P.btc;
document.getElementById('usdtA').textContent=P.usdt;
document.getElementById('evmA').textContent=P.evm;
document.getElementById('solA').textContent=P.sol;
document.getElementById('donQR').src='https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent('bitcoin:'+P.btc);
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.coinzillaSrc){el.innerHTML='';const s=document.createElement('script');s.async=true;s.src=A.coinzillaSrc;if(A.coinzillaZone)s.dataset.zone=A.coinzillaZone;el.appendChild(s);}
else if(A.cointrafficSrc){el.innerHTML='';const s=document.createElement('script');s.async=true;s.src=A.cointrafficSrc;el.appendChild(s);}
else if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
}
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied'));}
setLang('en');loadAds();renderDonate();
</script>
